```yaml
---
- name: Install Approved Windows Server 2022 Security Update
  hosts: Win_Server
  gather_facts: false

  vars:
    target_kb: "KB5129237"

  tasks:

    # ============================================================
    # 1. CHECK WHETHER THE TARGET KB IS ALREADY INSTALLED
    # ============================================================

    - name: Check target cumulative update installation status
      ansible.windows.win_shell: |
        $kb = Get-HotFix -Id "{{ target_kb }}" -ErrorAction SilentlyContinue

        if ($kb) {
          Write-Output "INSTALLED"
          Write-Output "KB: $($kb.HotFixID)"
          Write-Output "Installed On: $($kb.InstalledOn)"
        }
        else {
          Write-Output "NOT_INSTALLED"
        }
      register: kb_status
      changed_when: false

    - name: Display current target KB status
      ansible.builtin.debug:
        msg: "{{ kb_status.stdout_lines }}"

    # ============================================================
    # 2. INSTALL ONLY THE APPROVED SECURITY UPDATE
    # ============================================================

    - name: Install target cumulative security update
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
        accept_list:
          - "{{ target_kb }}"
        state: installed
        reboot: true
        reboot_timeout: 3600
      register: windows_update_result
      when: "'NOT_INSTALLED' in kb_status.stdout"

    # ============================================================
    # 3. DISPLAY INSTALLATION RESULT
    # ============================================================

    - name: Display Windows Update execution result
      ansible.builtin.debug:
        msg:
          - "Target KB: {{ target_kb }}"
          - "Updates found: {{ windows_update_result.found_update_count | default(0) }}"
          - "Updates installed: {{ windows_update_result.installed_update_count | default(0) }}"
          - "Reboot required: {{ windows_update_result.reboot_required | default(false) }}"
          - "Server rebooted: {{ windows_update_result.rebooted | default(false) }}"

    # ============================================================
    # 4. VERIFY THE TARGET KB AFTER INSTALLATION
    # ============================================================

    - name: Verify target cumulative security update
      ansible.windows.win_shell: |
        $kb = Get-HotFix -Id "{{ target_kb }}" -ErrorAction SilentlyContinue

        if ($kb) {
          Write-Output "SUCCESS"
          Write-Output "KB: $($kb.HotFixID)"
          Write-Output "Installed On: $($kb.InstalledOn)"
        }
        else {
          Write-Output "FAILED - {{ target_kb }} is not installed"
          exit 1
        }
      register: kb_verify
      changed_when: false

    - name: Display final target KB verification
      ansible.builtin.debug:
        msg: "{{ kb_verify.stdout_lines }}"

    # ============================================================
    # 5. PUBLISH KB FOR THE DOWNSTREAM COMPLIANCE JOB
    # ============================================================

    - name: Publish target KB to AWX workflow artifacts
      ansible.builtin.set_stats:
        data:
          target_kb: "{{ target_kb }}"
        aggregate: true

    - name: Confirm target KB published
      ansible.builtin.debug:
        msg: "Published {{ target_kb }} for the downstream compliance report."
```
