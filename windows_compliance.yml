---
- name: Generate Windows Server 2022 Patch Compliance Report
  hosts: Win_Server
  gather_facts: false

  vars:
    target_update_type: "Monthly Cumulative Security Update"
    minimum_disk_gb: 10
    aws_region: "ap-south-1"

  tasks:

    # ============================================================
    # 1. VALIDATE KB RECEIVED FROM THE AWX WORKFLOW
    # ============================================================

    - name: Validate target KB received from patch workflow
      ansible.builtin.assert:
        that:
          - target_kb is defined
          - target_kb | string | trim | length > 0
        fail_msg: >-
          No target KB was received from the patch workflow.
          Ensure patch.yml publishes target_kb using set_stats
          and this compliance job runs downstream in the same AWX workflow.
        success_msg: "Target KB received: {{ target_kb }}"

    - name: Record compliance report start time
      ansible.builtin.set_fact:
        compliance_report_start: "{{ now(utc=true, fmt='%Y-%m-%d %H:%M:%S UTC') }}"

    # ============================================================
    # 2. COLLECT SERVER INFORMATION
    # ============================================================

    - name: Collect Windows Server information
      ansible.windows.win_shell: |
        $os = Get-CimInstance Win32_OperatingSystem

        [PSCustomObject]@{
          Hostname = $env:COMPUTERNAME
          OperatingSystem = $os.Caption
          Version = $os.Version
          Build = $os.BuildNumber
          LastBoot = $os.LastBootUpTime.ToString("yyyy-MM-dd HH:mm:ss")
        } | ConvertTo-Json -Compress
      register: server_info_result
      changed_when: false

    - name: Store server information
      ansible.builtin.set_fact:
        server_info: "{{ server_info_result.stdout | from_json }}"
        server_ip: "{{ ansible_host | default(inventory_hostname) }}"

    # ============================================================
    # 3. CHECK C DRIVE SPACE
    # ============================================================

    - name: Check C drive capacity and free space
      ansible.windows.win_shell: |
        $drive = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"

        [PSCustomObject]@{
          Drive = "C:"
          TotalGB = [math]::Round($drive.Size / 1GB, 2)
          FreeGB = [math]::Round($drive.FreeSpace / 1GB, 2)
        } | ConvertTo-Json -Compress
      register: disk_result
      changed_when: false

    - name: Store disk information
      ansible.builtin.set_fact:
        disk_info: "{{ disk_result.stdout | from_json }}"

    - name: Determine disk compliance
      ansible.builtin.set_fact:
        disk_status: >-
          {{
            'PASS'
            if (disk_info.FreeGB | float) >= (minimum_disk_gb | float)
            else 'FAIL'
          }}

    # ============================================================
    # 4. VERIFY WINRM CONNECTIVITY
    # ============================================================

    - name: Verify Windows host connectivity
      ansible.windows.win_ping:
      register: winrm_result
      changed_when: false

    - name: Set WinRM compliance status
      ansible.builtin.set_fact:
        winrm_status: "{{ 'PASS' if winrm_result.ping == 'pong' else 'FAIL' }}"

    # ============================================================
    # 5. CHECK WINDOWS UPDATE SERVICE (INFORMATIONAL)
    # ============================================================

    - name: Collect Windows Update service status
      ansible.windows.win_shell: |
        $service = Get-CimInstance Win32_Service -Filter "Name='wuauserv'"

        [PSCustomObject]@{
          Status = $service.State
          StartMode = $service.StartMode
        } | ConvertTo-Json -Compress
      register: update_service_result
      changed_when: false

    - name: Store Windows Update service information
      ansible.builtin.set_fact:
        update_service_info: "{{ update_service_result.stdout | from_json }}"

    # ============================================================
    # 6. CHECK FOR PENDING REBOOT
    # ============================================================

    - name: Check Windows reboot indicators
      ansible.windows.win_shell: |
        $cbsPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending"
        $wuPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired"
        $sessionPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager"

        # Primary reboot indicators
        $cbsPending = Test-Path $cbsPath
        $wuPending = Test-Path $wuPath

        # Additional diagnostic information only
        $renameValue = Get-ItemProperty `
          -Path $sessionPath `
          -Name "PendingFileRenameOperations" `
          -ErrorAction SilentlyContinue

        $fileRenamePending = $null -ne $renameValue

        # Pending file rename operations alone do not prove
        # that a reboot is required.
        $rebootRequired = ($cbsPending -or $wuPending)

        [PSCustomObject]@{
          CBSPending = $cbsPending
          WindowsUpdatePending = $wuPending
          PendingFileRenameOperations = $fileRenamePending
          RebootRequired = $rebootRequired
        } | ConvertTo-Json -Compress
      register: reboot_result
      changed_when: false

    - name: Store reboot validation results
      ansible.builtin.set_fact:
        reboot_info: "{{ reboot_result.stdout | from_json }}"

    - name: Determine reboot compliance
      ansible.builtin.set_fact:
        reboot_status: "{{ 'FAIL' if reboot_info.RebootRequired else 'PASS' }}"

    # ============================================================
    # 7. VERIFY THE TARGET CUMULATIVE UPDATE
    # ============================================================

    - name: Check target KB installation status
      ansible.windows.win_shell: |
        $TargetKB = "{{ target_kb }}"
        $kb = Get-HotFix -Id $TargetKB -ErrorAction SilentlyContinue

        if ($kb) {
          $installedOn = $null

          if ($kb.InstalledOn) {
            $installedOn = ([datetime]$kb.InstalledOn).ToString("MMM dd, yyyy")
          }

          [PSCustomObject]@{
            KB = $TargetKB
            Status = "INSTALLED"
            InstalledOn = $installedOn
          } | ConvertTo-Json -Compress
        }
        else {
          [PSCustomObject]@{
            KB = $TargetKB
            Status = "NOT_INSTALLED"
            InstalledOn = $null
          } | ConvertTo-Json -Compress
        }
      register: target_update_result
      changed_when: false

    - name: Store target KB verification
      ansible.builtin.set_fact:
        target_update_info: "{{ target_update_result.stdout | from_json }}"

    - name: Set target KB compliance values
      ansible.builtin.set_fact:
        target_kb_reported: "{{ target_update_info.KB }}"
        target_kb_installed: "{{ target_update_info.Status == 'INSTALLED' }}"
        target_kb_installed_on: "{{ target_update_info.InstalledOn | default('Not available', true) }}"
        patch_verification_status: "{{ 'PASS' if target_update_info.Status == 'INSTALLED' else 'FAIL' }}"

    # ============================================================
    # 8. FIND THE LATEST MATCHING AWS EBS SNAPSHOT
    # ============================================================

    - name: Retrieve Windows patching snapshots
      amazon.aws.ec2_snapshot_info:
        region: "{{ aws_region }}"
        filters:
          "tag:PatchWorkflow": "Windows-Patching"
          "tag:ServerIP": "{{ server_ip }}"
      register: snapshot_lookup_result
      delegate_to: localhost
      become: false
      failed_when: false

    - name: Select latest matching snapshot
      ansible.builtin.set_fact:
        latest_snapshot: >-
          {{
            (
              snapshot_lookup_result.snapshots | default([])
              | sort(attribute='start_time', reverse=true)
              | first
            ) | default({})
          }}

    - name: Determine snapshot compliance
      ansible.builtin.set_fact:
        snapshot_id_reported: "{{ latest_snapshot.snapshot_id | default('Not found') }}"
        snapshot_state_reported: "{{ latest_snapshot.state | default('Not found') }}"
        snapshot_status: >-
          {{
            'PASS'
            if (latest_snapshot.state | default('')) == 'completed'
            else 'FAIL'
          }}

    # ============================================================
    # 9. CALCULATE OVERALL HEALTH AND COMPLIANCE
    # ============================================================

    - name: Determine overall server health
      ansible.builtin.set_fact:
        server_health_status: >-
          {{
            'PASS'
            if (
              winrm_status == 'PASS'
              and disk_status == 'PASS'
              and reboot_status == 'PASS'
            )
            else 'FAIL'
          }}

    - name: Determine overall patch compliance
      ansible.builtin.set_fact:
        compliance_status: >-
          {{
            'COMPLIANT'
            if (
              patch_verification_status == 'PASS'
              and snapshot_status == 'PASS'
              and server_health_status == 'PASS'
            )
            else 'NON-COMPLIANT'
          }}

    - name: Record compliance report end time
      ansible.builtin.set_fact:
        compliance_report_end: "{{ now(utc=true, fmt='%Y-%m-%d %H:%M:%S UTC') }}"

    # ============================================================
    # 10. DISPLAY PATCH COMPLIANCE REPORT
    # ============================================================

    - name: Display Windows Server patch compliance report
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "       WINDOWS SERVER 2022 PATCH COMPLIANCE REPORT"
          - "============================================================"
          - ""
          - "SERVER INFORMATION"
          - "------------------------------------------------------------"
          - "Hostname              : {{ server_info.Hostname }}"
          - "Server IP             : {{ server_ip }}"
          - "Operating System      : {{ server_info.OperatingSystem }}"
          - "OS Version            : {{ server_info.Version }}"
          - "OS Build              : {{ server_info.Build }}"
          - "Last Boot             : {{ server_info.LastBoot }}"
          - "Report Start (UTC)    : {{ compliance_report_start }}"
          - "Report End (UTC)      : {{ compliance_report_end }}"
          - ""
          - "TARGET SECURITY UPDATE"
          - "------------------------------------------------------------"
          - "Target KB             : {{ target_kb_reported }}"
          - "Update Type           : {{ target_update_type }}"
          - "Installation Status   : {{ target_update_info.Status }}"
          - "Installed On          : {{ target_kb_installed_on }}"
          - "Verification          : {{ patch_verification_status }}"
          - ""
          - "BACKUP / EBS SNAPSHOT"
          - "------------------------------------------------------------"
          - "Snapshot ID           : {{ snapshot_id_reported }}"
          - "Snapshot State        : {{ snapshot_state_reported }}"
          - "Snapshot Verification : {{ snapshot_status }}"
          - ""
          - "POST-PATCH VALIDATION"
          - "------------------------------------------------------------"
          - "C Drive Total         : {{ disk_info.TotalGB }} GB"
          - "C Drive Free          : {{ disk_info.FreeGB }} GB"
          - "Minimum Free Required : {{ minimum_disk_gb }} GB"
          - "Disk Status           : {{ disk_status }}"
          - "WinRM Connectivity    : {{ winrm_status }}"
          - "Windows Update Service: {{ update_service_info.Status }} / {{ update_service_info.StartMode }}"
          - "Service Impact        : Informational only"
          - "Reboot Pending        : {{ reboot_info.RebootRequired }}"
          - "Reboot Validation     : {{ reboot_status }}"
          - "Overall Server Health : {{ server_health_status }}"
          - ""
          - "COMPLIANCE SUMMARY"
          - "------------------------------------------------------------"
          - "Overall Status        : {{ compliance_status }}"
          - "============================================================"

    # ============================================================
    # 11. FAIL THE AWX JOB IF NON-COMPLIANT
    # ============================================================

    - name: Fail compliance job when server is non-compliant
      ansible.builtin.fail:
        msg: >-
          Windows patch compliance failed.
          Target KB={{ target_kb }},
          Patch={{ patch_verification_status }},
          Snapshot={{ snapshot_status }},
          Server health={{ server_health_status }}.
      when: compliance_status != 'COMPLIANT'

    - name: Confirm successful compliance
      ansible.builtin.debug:
        msg: "COMPLIANT: {{ server_info.Hostname }} passed all required patch compliance checks."
      when: compliance_status == 'COMPLIANT'
